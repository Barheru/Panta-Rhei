- type: entity
  name: coffee pot
  parent: [DrinkBaseMaterialMetal, DrinkBase]
  id: DrinkCoffeepot
  description: A solid, old fashioned coffee pot.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
        reagents:
        - ReagentId: Coffee
          Quantity: 100
  - type: Sprite
    sprite: _Euphoria/Objects/Misc/coffeepot.rsi
  - type: FitsInDispenser
