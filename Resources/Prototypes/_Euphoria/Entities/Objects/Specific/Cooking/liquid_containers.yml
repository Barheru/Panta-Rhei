  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
        
- type: entity
  name: hot chocolate pot
  parent: [DrinkBaseMaterialPorcelain, DrinkBase]
  id: DrinkHotchocolatepot
  description: A hot chocolate pot, after the Edwardian style. True beverage enjoyers know that the difference between a hot chocolate pot and a teapot is that the spout of the hot chocolate pot is at the top, whereas the spout of a teapot is at the base. Normal people know that this is splitting hairs.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
        reagents:
        - ReagentId: HotCocoa
          Quantity: 100
  - type: Sprite
    sprite: _Euphoria/Objects/Misc/hotchocolatepot.rsi
  - type: FitsInDispenser
    solution: drink
    
