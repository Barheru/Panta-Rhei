- type: entity
  name: sugar bowl
  parent: [DrinkBaseMaterialPorcelain, DrinkBase]
  description: Used to hold sugar in an appealing container.
  id: Sugarbowl
  components:
  - type: Sprite
    sprite: _Euphoria/Objects/Misc/sugarbowl.rsi
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 30
        reagents:
        - ReagentId: Sugar
          Quantity: 30
  - type: Appearance
  - type: StaticPrice
    price: 25
    
